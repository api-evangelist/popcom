name: PopCom
description: >-
  PopCom is an AI-powered automated retail technology company founded by e-commerce
  entrepreneur Dawn Dickson. Its flagship product, the PopShop, is a robotic self-service
  kiosk that dispenses physical and digital products while capturing customer data through
  computer vision, facial recognition, and real-time analytics. The platform gives brands
  and entrepreneurs the kind of sales metrics, inventory monitoring, targeted advertising,
  and customer-sentiment insight that online retailers enjoy, but for physical, unattended
  retail. PopCom sells its hardware on an annual lease with a monthly software subscription.
  It was added to the API Evangelist network as a Techstars portfolio company; as of this
  enrichment pass PopCom publishes no public developer platform, API, or specification.
